name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ARCH §8. External services are mocked so CI never needs secrets (AGENTS §5).
env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  MOCK_DB: "1"
  MOCK_NOTIFY: "1"
  MOCK_IMAGE_PROVIDER: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: No server secret names in client bundles
        run: |
          if grep -rEl "DATABASE_URL|GEMINI_API_KEY|CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|NTFY_TOPIC|IP_HASH_SALT" .next/static; then
            echo "::error::A server-only env var name appears in the client bundle (AGENTS §2.5)."
            exit 1
          fi

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
